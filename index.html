<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Safe Gallery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --white: #ffffff; --text: #1e293b; --danger: #ef4444; }
        
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); height: 100%; overflow: hidden; color: var(--text); }

        /* Header */
        header { background: var(--primary); color: white; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls { display: flex; gap: 10px; margin-top: 12px; }
        #searchInput { flex-grow: 1; padding: 12px; border-radius: 12px; border: none; outline: none; font-size: 14px; }
        
        /* List Layout */
        .list-container { display: flex; flex-direction: column; gap: 10px; padding: 15px; overflow-y: auto; height: calc(100% - 135px); box-sizing: border-box; }
        .pdf-card { background: var(--white); border-radius: 15px; padding: 12px 15px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .pdf-icon { font-size: 30px; margin-right: 15px; }
        .pdf-info { flex-grow: 1; overflow: hidden; cursor: pointer; }
        .pdf-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

        /* Buttons */
        .card-actions { display: flex; gap: 8px; }
        .action-btn { border: none; background: #f1f5f9; font-size: 18px; cursor: pointer; padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }

        /* Viewer UI */
        #viewerScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 5000; flex-direction: column; }
        .viewer-nav { background: #1e293b; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .nav-right { display: flex; gap: 10px; }
        .share-btn-top { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }

        #canvasContainer { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        canvas { max-width: 100%; margin-bottom: 12px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        /* Print styles for Save as PDF */
        @media print {
            header, .list-container, .fab, .viewer-nav { display: none !important; }
            #viewerScreen, #canvasContainer { position: static; display: block; background: white; height: auto; overflow: visible; }
            canvas { box-shadow: none; max-width: 100%; page-break-after: always; }
        }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; border: none; font-size: 30px; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4); z-index: 100; }
        #fileInput { display: none; }

        /* Modal */
        #confirmModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .m-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; font-size:20px;">PDF Safe Gallery</div>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search file..." onkeyup="searchPDF()">
    </div>
</header>

<div class="list-container" id="pdfList"></div>

<input type="file" id="fileInput" accept=".pdf" onchange="uploadPDF(event)">
<button class="fab" onclick="document.getElementById('fileInput').click()">+</button>

<div id="confirmModal">
    <div class="modal-box">
        <h3 style="margin:0">Delete File?</h3>
        <p style="color:#64748b; font-size:14px; margin-top:10px;">Are you sure you want to delete this file?</p>
        <div class="modal-btns">
            <button class="m-btn" style="background:#f1f5f9" onclick="closeModal()">No</button>
            <button class="m-btn" style="background:var(--danger); color:white" id="confirmDeleteBtn">Yes, Delete</button>
        </div>
    </div>
</div>

<div id="viewerScreen">
    <div class="viewer-nav">
        <button onclick="closeViewer()" style="background:none; border:none; color:white; font-size:24px;">✕</button>
        <div class="nav-right">
            <button class="share-btn-top" id="viewShareBtn">📤 Share / Save</button>
        </div>
    </div>
    <div id="canvasContainer"></div>
</div>

<script>
    let db, allPDFs = [], activeFile = null, deleteTargetId = null;

    // Database Setup
    const request = indexedDB.open("PDF_Gallery_Safe_v7", 1);
    request.onupgradeneeded = (e) => e.target.result.createObjectStore("pdfs", { keyPath: "id", autoIncrement: true });
    request.onsuccess = (e) => { db = e.target.result; loadFromDB(); };

    // --- Upload Function ---
    function uploadPDF(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            db.transaction(["pdfs"], "readwrite").objectStore("pdfs").add({ 
                name: file.name, 
                data: e.target.result, 
                timestamp: Date.now() 
            });
            loadFromDB();
        };
        reader.readAsDataURL(file);
    }

    // --- Load Data ---
    function loadFromDB() {
        allPDFs = [];
        db.transaction("pdfs").objectStore("pdfs").openCursor().onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) { allPDFs.push(cursor.value); cursor.continue(); }
            else { 
                allPDFs.sort((a, b) => b.timestamp - a.timestamp);
                renderList(allPDFs); 
            }
        };
    }

    // --- Render List ---
    function renderList(items) {
        const list = document.getElementById('pdfList');
        list.innerHTML = items.length === 0 ? "<p style='text-align:center; color:#94a3b8; margin-top:50px;'>No PDFs found</p>" : "";
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'pdf-card';
            div.innerHTML = `
                <div class="pdf-icon" onclick="openPDF(${item.id})">📕</div>
                <div class="pdf-info" onclick="openPDF(${item.id})">
                    <span class="pdf-name">${item.name}</span>
                </div>
                <div class="card-actions">
                    <button class="action-btn" style="color:var(--danger)" onclick="askDelete(${item.id})">🗑️</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function searchPDF() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        renderList(allPDFs.filter(p => p.name.toLowerCase().includes(query)));
    }

    // --- SMART SHARE LOGIC ---
    async function handleShare() {
        if (!activeFile) return;

        const shareBtn = document.getElementById('viewShareBtn');
        const originalText = shareBtn.innerText;
        shareBtn.innerText = "Processing...";

        try {
            // 1. Convert Base64 Data URL to Blob
            const response = await fetch(activeFile.data);
            const blob = await response.blob();
            const file = new File([blob], activeFile.name, { type: 'application/pdf' });

            // 2. Try Native Share
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: activeFile.name,
                    text: 'Shared from PDF Gallery'
                });
            } else {
                throw new Error("Native sharing not supported.");
            }
        } catch (error) {
            console.warn("Share failed:", error);
            
            // 3. Fallback: Print to PDF (Safe for HopWeb)
            const usePrint = confirm("Share menu failed or not supported.\n\nDo you want to Save as PDF using Print?");
            if(usePrint) {
                setTimeout(() => window.print(), 500);
            }
        } finally {
            shareBtn.innerText = originalText;
        }
    }

    // --- Viewer Logic ---
    async function openPDF(id) {
        activeFile = allPDFs.find(p => p.id === id);
        document.getElementById('viewerScreen').style.display = 'flex';
        const container = document.getElementById('canvasContainer');
        container.innerHTML = "<p style='color:white; margin-top:20px;'>Rendering PDF...</p>";

        document.getElementById('viewShareBtn').onclick = handleShare;

        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        try {
            const pdf = await pdfjsLib.getDocument(activeFile.data).promise;
            container.innerHTML = "";
            for (let n = 1; n <= pdf.numPages; n++) {
                const page = await pdf.getPage(n);
                const vp = page.getViewport({ scale: 1.0 }); 
                const canvas = document.createElement('canvas');
                canvas.height = vp.height; 
                canvas.width = vp.width;
                
                await page.render({
                    canvasContext: canvas.getContext('2d'),
                    viewport: vp
                }).promise;
                container.appendChild(canvas);
            }
        } catch(e) { 
            console.error(e);
            container.innerHTML = "<p style='color:red'>Error loading PDF</p>"; 
        }
    }

    // --- Delete Logic ---
    function askDelete(id) { deleteTargetId = id; document.getElementById('confirmModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }
    document.getElementById('confirmDeleteBtn').onclick = () => {
        db.transaction(["pdfs"], "readwrite").objectStore("pdfs").delete(deleteTargetId);
        loadFromDB(); closeModal();
    };

    function closeViewer() { 
        document.getElementById('viewerScreen').style.display = 'none'; 
        document.getElementById('canvasContainer').innerHTML = ""; 
        activeFile = null;
    }
</script>
</body>
</html>
